# fcw configuration file
project: test-fcw

# Workdir mapping - all paths are relative to this
workdir:
  remote: ${FIRECREST_SCRATCH}/fcw-basic-${FCW_BASIC_RUN_ID}
  local: .

# Directory declarations with data flow type
# type: in (upload only), out (download only), both (bidirectional)
directories:
  data/raw:
    type: in
  data/processed:
    type: out
  outputs:
    type: out
  config:
    type: in

# Container definitions
containers:
  app:
    file: ./env/Dockerfile.app
    tag: ubuntu-fcw-basic:24.04
    remote_path: ./ce-images/
    toml: ./env/container.toml
  aux:
    file: ./env/Dockerfile.aux
    tag: fcw-aux:latest
    remote_path: ./ce-images/

# Job definitions with environment
# container: references a container from the containers section;
# at submit time, fcw inlines the TOML and resolves the image path automatically
jobs:
  preprocess:
    script: slurm/preprocess.sh
    container: app
    env:
      DATA_IN: data/raw
      DATA_OUT: data/processed

  train:
    script: slurm/train.sh
    container: app
    time: "12:00:00"
    nodes: 1
    env:
      DATA_DIR: data/processed
      OUTPUT_DIR: outputs
      CONFIG_DIR: config

  evaluate:
    script: slurm/evaluate.sh
    container: app
    env:
      MODEL_DIR: outputs
