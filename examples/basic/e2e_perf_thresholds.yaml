# Performance thresholds for e2e steps (seconds).
# Thresholds are per-system since HPC performance varies across clusters.
# Set generously (3-5x typical time) to flag only significant regressions.
#
# Step names match the step_name argument to timed_step() in the tests.
# Steps not listed here are timed and logged but never checked.

default:
  upload-env: 60
  upload-slurm: 60
  upload-data: 120
  upload-incremental: 60
  container-build-local: 300
  container-push: 600
  container-build-remote: 900
  container-deploy: 900
  container-extract: 300
  container-patch: 120
  container-rebuild: 900
  job-preprocess: 600
  job-train: 900
  job-evaluate: 600
  job-run-and-wait: 300
  download-outputs: 120
  download-incremental: 60

