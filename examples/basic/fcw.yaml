# fcw configuration file
project: test-fcw

workdir:  # Workdir mapping - all paths are relative to this
  remote: ${FIRECREST_SCRATCH}/fcw-basic-${FCW_BASIC_RUN_ID}
  local: .

directories:  # data dirs with data flow: in (upload only), out (download only), both
  data/raw:
    type: in
  data/processed:
    type: out
  outputs:
    type: out
  config:
    type: in

containers:  # Container definitions
  app:
    file: ./env/Dockerfile.app
    tag: ubuntu-fcw-basic:24.04
    remote_path: ./ce-images/
    toml: ./env/container.toml
    platform: linux/arm64
  aux:
    file: ./env/Dockerfile.aux
    tag: fcw-aux:latest
    remote_path: ./ce-images/
    platform: linux/arm64

jobs:  # Job definitions with environment
       # container: references a container from the containers section;
       # at submit time, fcw inlines the TOML and resolves the image path automatically
  preprocess:
    script: slurm/preprocess.sh
    container: app
    env_paths:  # path-valued env vars, resolved against workdir.remote
      DATA_IN: data/raw
      DATA_OUT: data/processed

  train:
    script: slurm/train.sh
    container: app
    time: "00:30:00"
    nodes: 1
    env_paths:  # path-valued env vars, resolved against workdir.remote
      DATA_DIR: data/processed
      OUTPUT_DIR: outputs
      CONFIG_DIR: config

  evaluate:
    script: slurm/evaluate.sh
    container: app
    env_paths:  # path-valued env vars, resolved against workdir.remote
      MODEL_DIR: outputs
